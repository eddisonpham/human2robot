[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "human2robot"
version = "0.1.0"
description = "Physics-grounded, demonstration-guided RL for dexterous manipulation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.7.0",
    "mujoco>=3.3",
    "gymnasium>=1.0",
    "gymnasium-robotics==1.4.2",
    "minari[hf,hdf5]>=0.5",
    "pydantic>=2.7",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "gdown>=6.4.0",
    "ninja>=1.13.2",
]

# NOTE: dex-retargeting (needed only for Tier B retargeting, Phase 4) is
# intentionally not a dependency. It requires Pinocchio, which publishes no
# Windows wheels. On Linux or WSL install it into the venv directly:
#   uv pip install dex-retargeting

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]
sb3 = [
    "stable-baselines3>=2.3",
]

# PyTorch must come from the CUDA 12.8 index: the RTX 5060 is Blackwell
# (compute capability sm_120), supported only by torch >= 2.7.0 cu128 builds.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/human2robot"]

[project.scripts]
human2robot-train = "human2robot.rl.train:main"
human2robot-eval = "human2robot.evaluation.cli:main"
human2robot-plot = "human2robot.evaluation.plot_cli:main"
human2robot-sb3-check = "human2robot.evaluation.sb3_check:main"
human2robot-export = "human2robot.export.onnx:main"
human2robot-benchmark = "human2robot.evaluation.benchmark:main"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "--cov=human2robot --cov-report=term-missing --cov-fail-under=90 -q -m 'not network'"
markers = ["network: requires internet access to download datasets (deselected by default)"]

[tool.coverage.run]
source = ["src/human2robot"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
