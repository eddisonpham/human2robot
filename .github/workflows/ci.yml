name: CI

# This runs on windows-latest on purpose. pyproject.toml declares
# required-environments = ["sys_platform == 'win32' and platform_machine ==
# 'AMD64'"] and pulls torch from a cu128 index pinned for that platform, so a
# Linux runner cannot resolve the dependency set. Making CI portable means
# revisiting that pin, which is a dependency change rather than a CI change.
# The cost is that this workflow is slower and less portable than a Linux
# matrix would be.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, format, tests, C++ build and GoogleTest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Pin the project Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # Coverage is gated at 90 percent in pyproject.toml, so a drop below the
      # floor fails this step rather than needing a separate threshold here.
      - name: Python tests
        run: uv run pytest tests/python/ -p no:cacheprovider

      - name: Cache CMake fetch and build
        uses: actions/cache@v4
        with:
          path: |
            cpp/build
            ~/.cache/CPM
          key: ${{ runner.os }}-cpp-${{ hashFiles('cpp/CMakeLists.txt') }}

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja into the venv
        run: uv pip install ninja

      - name: Configure C++ and the pybind11 module
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DPYTHON_EXECUTABLE="$PWD/.venv/Scripts/python.exe"
        shell: pwsh

      - name: Build C++
        run: cmake --build cpp/build
        shell: pwsh

      - name: C++ GoogleTest suite
        run: ctest --test-dir cpp/build --output-on-failure
        shell: pwsh

      - name: Verify the bindings import
        run: uv run python scripts/check_bindings.py
